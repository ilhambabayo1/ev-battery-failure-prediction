<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EV Battery Failure Prediction</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #060b14;
    --cyan: #38bdf8;
    --text: #e6edf6;
    --muted: #94a3b8;
    --glass: rgba(255, 255, 255, 0.055);
    --border: rgba(255, 255, 255, 0.12);
  }
  body {
    margin: 0; min-height: 100vh; overflow-x: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
  }

  /* ---------- animated background ---------- */
  .bg-blobs, .bg-grid { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .bg-blobs::before, .bg-blobs::after {
    content: ""; position: absolute; width: 62vmax; height: 62vmax; border-radius: 50%;
    filter: blur(90px); opacity: .32;
  }
  .bg-blobs::before { background: radial-gradient(circle, #0ea5e9, transparent 65%); top: -22vmax; left: -16vmax; }
  .bg-blobs::after  { background: radial-gradient(circle, #7c3aed, transparent 65%); bottom: -26vmax; right: -16vmax; }
  .bg-grid {
    background-image:
      linear-gradient(rgba(148,163,184,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,.05) 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 74%);
    mask-image: radial-gradient(ellipse at center, black 25%, transparent 74%);
  }
  /* ---------- giant battery behind the card (static) ---------- */
  .bg-battery { position: fixed; right: -40px; top: 50%; transform: translateY(-50%); z-index: 0; pointer-events: none; opacity: .5; }
  .bb-cap { width: 64px; height: 14px; margin: 0 auto; border-radius: 6px 6px 0 0; background: rgba(56,189,248,.3); }
  .bb-body {
    width: 200px; height: 360px; position: relative; overflow: hidden;
    border: 2px solid rgba(56,189,248,.28); border-radius: 26px;
    background: rgba(56,189,248,.04);
  }
  .bb-liquid { position: absolute; left: 0; right: 0; bottom: 0; height: 45%; }
  .bb-liquid span {
    position: absolute; left: 50%; top: 0; width: 300px; height: 300px; border-radius: 42%;
    background: rgba(56,189,248,.20); transform: translate(-50%, -50%);
  }
  .bb-liquid span:nth-child(2) { background: rgba(56,189,248,.13); }
  @media (max-width: 980px) { .bg-battery { display: none; } }

  /* ---------- glass card ---------- */
  .wrap { position: relative; z-index: 1; display: flex; justify-content: center; padding: 48px 20px; }
  .card {
    width: 100%; max-width: 880px; padding: 40px 42px;
    background: var(--glass); border: 1px solid var(--border); border-radius: 22px;
    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 24px 70px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 18px;
    padding: 6px 14px; border-radius: 999px; font-size: .74rem; letter-spacing: .04em;
    color: #86efac; background: rgba(52,211,153,.09); border: 1px solid rgba(52,211,153,.28);
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; }
  h1 { margin: 0 0 6px; font-size: 1.7rem; font-weight: 650; letter-spacing: -0.01em; }
  .sub { margin: 0 0 28px; color: var(--muted); font-size: .92rem; line-height: 1.5; }

  /* ---------- form ---------- */
  #fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 14px 18px; }
  label { display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-bottom: 5px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.14); background: rgba(8,15,28,.55); color: var(--text);
    font-size: .9rem; outline: none; transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input::placeholder { color: #475569; }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(56,189,248,.15); background: rgba(8,15,28,.8); }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; }

  button {
    margin-top: 26px; width: 100%; padding: 14px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 1rem; font-weight: 600; letter-spacing: .02em; color: #04121f;
    background: linear-gradient(90deg, #38bdf8, #60a5fa);
    transition: transform .15s, box-shadow .2s, filter .2s;
    box-shadow: 0 10px 30px rgba(56,189,248,.25);
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 14px 38px rgba(56,189,248,.35); filter: brightness(1.06); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: .6; cursor: wait; }

  /* ---------- result: live battery gauge ---------- */
  #result { display: none; margin-top: 30px; padding-top: 26px; border-top: 1px solid var(--border); }
  .result-top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  #prob { font-size: 2.6rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  #label { font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; padding: 6px 14px; border-radius: 999px; border: 1px solid; }
  .gauge-row { display: flex; align-items: center; gap: 10px; }
  .gauge-shell { position: relative; flex: 1; height: 30px; border: 1px solid var(--border); border-radius: 10px; background: rgba(8,15,28,.6); overflow: hidden; }
  .gauge-cap { width: 12px; height: 18px; border-radius: 0 5px 5px 0; background: rgba(255,255,255,.18); }
  .gauge-fill {
    height: 100%; width: 0%; border-radius: 9px 0 0 9px; position: relative; overflow: hidden;
    transition: width 1.2s cubic-bezier(.22,.9,.3,1), background .5s;
  }
  .gauge-fill::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(115deg, rgba(255,255,255,.16) 0 10px, transparent 10px 22px);
  }
  .lvl-ok   { background: linear-gradient(90deg, #10b981, #34d399); }
  .lvl-warn { background: linear-gradient(90deg, #d97706, #fbbf24); }
  .lvl-bad  { background: linear-gradient(90deg, #dc2626, #f87171); }
  .tag-ok   { color: #86efac; border-color: rgba(52,211,153,.4);  background: rgba(52,211,153,.09); }
  .tag-warn { color: #fcd34d; border-color: rgba(251,191,36,.4);  background: rgba(251,191,36,.09); }
  .tag-bad  { color: #fca5a5; border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.09); }
  .hint { margin-top: 12px; font-size: .78rem; color: var(--muted); }

  @media (max-width: 560px) { .card { padding: 28px 22px; } #prob { font-size: 2rem; } }
</style>
</head>
<body>
  <div class="bg-blobs"></div>
  <div class="bg-grid"></div>

  <div class="bg-battery" aria-hidden="true">
    <div class="bb-cap"></div>
    <div class="bb-body"><div class="bb-liquid"><span></span><span></span></div></div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="chip"><span class="dot"></span><span id="chipText">Connecting to model...</span></div>
      <h1>EV Battery Failure Prediction</h1>
      <p class="sub">Enter telemetry values below. Feature inputs are scaled and encoded by the exact preprocessor fitted during training, then scored by the neural network.</p>

      <div id="fields"></div>
      <button id="btn" onclick="predict()">Predict Failure Risk</button>

      <div id="result">
        <div class="result-top">
          <div id="prob">0.0%</div>
          <div id="label" class="tag-ok">No failure</div>
        </div>
        <div class="gauge-row">
          <div class="gauge-shell"><div class="gauge-fill lvl-ok" id="gaugeFill"></div></div>
          <div class="gauge-cap"></div>
        </div>
        <div class="hint">Gauge shows predicted probability of battery failure.</div>
      </div>
    </div>
  </div>


<script>
  let featureCols = [];

  fetch('/health').then(r => r.json()).then(d => {
    const acc = (d.model_metrics.accuracy * 100).toFixed(1);
    document.getElementById('chipText').textContent = 'Model online - test accuracy ' + acc + '%';
  }).catch(() => {
    document.getElementById('chipText').textContent = 'Model offline';
  });

  fetch('/features').then(r => r.json()).then(d => {
    featureCols = d.feature_cols;
    const wrap = document.getElementById('fields');
    featureCols.forEach(col => {
      const div = document.createElement('div');
      const lab = document.createElement('label');
      lab.textContent = col.replaceAll('_', ' ');
      const inp = document.createElement('input');
      inp.id = 'f_' + col;
      inp.type = 'number';
      inp.step = 'any';
      inp.placeholder = '0';
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') predict(); });
      div.appendChild(lab); div.appendChild(inp);
      wrap.appendChild(div);
    });
  });

  function countUp(el, target) {
    const dur = 1100, t0 = performance.now();
    function step(t) {
      const p = Math.min((t - t0) / dur, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (target * eased * 100).toFixed(1) + '%';
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  async function predict() {
    const btn = document.getElementById('btn');
    const features = {};
    featureCols.forEach(col => {
      const v = document.getElementById('f_' + col).value;
      features[col] = v === '' ? 0 : parseFloat(v);
    });
    btn.disabled = true;
    btn.textContent = 'Analyzing...';
    try {
      const res = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ features })
      });
      const data = await res.json();
      const p = data.failure_probability;

      const box = document.getElementById('result');
      const fill = document.getElementById('gaugeFill');
      const label = document.getElementById('label');

      const lvl = p < 0.4 ? 'ok' : p < 0.75 ? 'warn' : 'bad';
      fill.className = 'gauge-fill lvl-' + lvl;
      label.className = 'tag-' + lvl;
      label.textContent = data.label + ' predicted';
      fill.style.width = (p * 100) + '%';
      countUp(document.getElementById('prob'), p);
      box.style.display = 'block';
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } finally {
      btn.disabled = false;
      btn.textContent = 'Predict Failure Risk';
    }
  }
</script>
</body>
</html>
